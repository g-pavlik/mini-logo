<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mini-logo</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --line:#232a33; --fg:#e6edf3; --dim:#8b949e;
  --accent:#4ea1ff; --cur:#1f3a57; --err:#f85149; --ink:#7ee787;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
header{
  display:flex;gap:8px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
button,select{
  font:inherit;color:var(--fg);background:#1f2630;border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;cursor:pointer;
}
button:not(:disabled):hover,select:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
h1{font-size:14px;font-weight:600;margin:0 10px 0 0;letter-spacing:.02em}
h1 span{color:var(--accent)}
#status{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
#status.err{color:var(--err)}
main{flex:1;display:flex;min-height:0}
#left{width:min(44%,540px);display:flex;border-right:1px solid var(--line)}
#src,#listing{
  flex:1;margin:0;padding:14px 14px 40vh;background:var(--panel);color:var(--fg);
  font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  border:0;outline:none;resize:none;overflow:auto;white-space:pre;
}
#listing{counter-reset:ln}
#listing div{padding:0 6px;border-radius:4px;min-height:1.7em}
#listing div::before{
  counter-increment:ln;content:counter(ln);display:inline-block;
  width:2.5em;margin-right:1.2em;text-align:right;color:var(--dim);
}
#listing div.cur{background:var(--cur);box-shadow:inset 3px 0 0 var(--accent)}
#right{flex:1;position:relative;background:#0b0e13}
canvas{position:absolute;inset:0}
#tests{padding:24px;font:13px/1.8 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
#tests .ok{color:var(--ink)}
#tests .no{color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>mini<span>·</span>logo</h1>
  <button id="reset">Reset</button>
  <button id="step">Step</button>
  <button id="stepout">Step Out</button>
  <button id="run">Run</button>
  <select id="speed">
    <option value="slow">slow</option>
    <option value="medium" selected>medium</option>
    <option value="fast">fast</option>
  </select>
  <span id="status">ready</span>
</header>
<main>
  <section id="left">
    <textarea id="src" spellcheck="false"></textarea>
    <div id="listing" hidden></div>
  </section>
  <section id="right">
    <canvas id="paper"></canvas>
    <canvas id="sprite"></canvas>
  </section>
</main>
<script>
// ---------- language ----------------------------------------------------

const CMDS = {
  fd:'fd', forward:'fd',
  bk:'bk', back:'bk', backward:'bk',
  rt:'rt', right:'rt',
  lt:'lt', left:'lt',
  pu:'pu', penup:'pu',
  pd:'pd', pendown:'pd',
};
const ARITY = { fd:1, bk:1, rt:1, lt:1, pu:0, pd:0 };

// Brackets separate from adjacent words, so `[fd` is two tokens. Every token
// carries its source line, which is all the highlight ever needs.
function tokenize(source) {
  const tokens = [];
  source.split('\n').forEach((raw, line) => {
    const text = raw.split(';')[0].replace(/[[\]]/g, ' $& ').trim();
    for (const t of text.split(/\s+/)) if (t) tokens.push({ text:t.toLowerCase(), line });
  });
  return tokens;
}

// Recursive descent. A node is either a primitive {op, arg?, line} or
// {op:'repeat', count, body, line}. Blocks and the top level are the same
// routine; they differ only in whether `]` closes or is an error.
function parseProgram(tokens) {
  const errors = [];
  let i = 0;
  const fail = (tok, msg) => errors.push({ line:tok.line, msg });

  function number(at, missing) {
    const tok = tokens[i];
    if (!tok || tok.text === '[' || tok.text === ']') { fail(at, missing); return null; }
    i++;
    const n = Number(tok.text);
    if (!Number.isFinite(n)) { fail(tok, `"${tok.text}" is not a number`); return null; }
    return n;
  }

  function repeatNode(tok) {
    const count = number(tok, 'repeat needs a number');
    let bad = count === null;
    if (!bad && (!Number.isInteger(count) || count < 0)) {
      fail(tok, 'repeat needs a whole number of times');
      bad = true;
    }
    const open = tokens[i];
    if (!open || open.text !== '[') {
      if (!bad) fail(tok, 'repeat needs [ after the count');
      return null;
    }
    i++;
    const body = block(open);   // consumed even when bad, to resync
    return bad ? null : { op:'repeat', count, body, line:tok.line };
  }

  function block(opener) {
    const body = [];
    while (i < tokens.length) {
      const tok = tokens[i++];
      if (tok.text === ']') {
        if (opener) return body;
        fail(tok, 'unexpected ]');
        continue;
      }
      if (tok.text === '[') { fail(tok, 'unexpected ['); block(tok); continue; }
      if (tok.text === 'repeat') {
        const node = repeatNode(tok);
        if (node) body.push(node);
        continue;
      }
      const op = CMDS[tok.text];
      if (!op) {
        fail(tok, `unknown command "${tok.text}"`);
        const next = tokens[i];
        if (next && Number.isFinite(Number(next.text))) i++;   // its argument
        continue;
      }
      if (ARITY[op] === 0) {
        const next = tokens[i];
        if (next && Number.isFinite(Number(next.text))) {
          fail(tok, `"${tok.text}" takes no number`);
          i++;
          continue;
        }
        body.push({ op, line:tok.line });
        continue;
      }
      const arg = number(tok, `"${tok.text}" needs a number`);
      if (arg !== null) body.push({ op, arg, line:tok.line });
    }
    if (opener) fail(opener, 'unclosed [');
    return body;
  }

  return { body:block(null), errors };
}

// The whole execution model. `yield*` handles nesting; `trail` carries one
// {i, of} per enclosing loop, so trail.length is the depth and the entries
// are the iteration counters.
function* walk(nodes, trail = []) {
  for (const n of nodes) {
    if (n.op === 'repeat')
      for (let i = 1; i <= n.count; i++) yield* walk(n.body, [...trail, { i, of:n.count }]);
    else
      yield { instr:n, trail };
  }
}

const RAD = Math.PI / 180;

// Pure. Returns the next state and the segment drawn, if any. Never touches
// the canvas -- that is what makes it testable without a DOM.
function step(state, instr) {
  const s = { ...state };
  let segment = null;
  switch (instr.op) {
    case 'rt': s.heading += instr.arg; break;
    case 'lt': s.heading -= instr.arg; break;
    case 'pu': s.pen = false; break;
    case 'pd': s.pen = true; break;
    case 'fd': case 'bk': {
      const n = instr.op === 'bk' ? -instr.arg : instr.arg;
      s.x = state.x + Math.sin(state.heading * RAD) * n;
      s.y = state.y - Math.cos(state.heading * RAD) * n;
      if (state.pen) segment = { x1:state.x, y1:state.y, x2:s.x, y2:s.y };
      break;
    }
  }
  return { state:s, segment };
}

// Which controls make sense right now. Pure, so the truth table is testable.
// editing: nothing executed yet. running: the continuous timer is driving.
// remaining: an instruction is pending. depth: how many loops enclose it.
function buttonState({ editing, running, remaining, depth }) {
  const finished = !editing && !remaining;
  return {
    step:    !running && !finished,              // fighting the timer, or nothing left
    stepout: !editing && !running && depth > 0,  // nothing to step out of
    run:     !finished,                          // stays live while running: it is Stop
    reset:   !editing,                           // nothing to undo yet
  };
}

// ---------- tests -------------------------------------------------------

function runTests() {
  const out = [];
  const t = (name, fn) => {
    try { fn(); out.push({ name, ok:true }); }
    catch (e) { out.push({ name, ok:false, why:e.message }); }
  };
  const eq = (a, b, what) => {
    if (Math.abs(a - b) > 1e-9) throw new Error(`${what}: ${a} != ${b}`);
  };
  const home = () => ({ x:0, y:0, heading:0, pen:true });
  const compile = src => parseProgram(tokenize(src));
  const trace = src => [...walk(compile(src).body)];
  const exec = src => trace(src).reduce((acc, { instr }) => {
    const r = step(acc.state, instr);
    return { state:r.state, segs: r.segment ? acc.segs.concat(r.segment) : acc.segs };
  }, { state:home(), segs:[] });
  const errs = src => compile(src).errors;
  const bare = n => JSON.stringify(n, (k, v) => k === 'line' ? undefined : v);

  t('unknown command is rejected', () => {
    const e = errs('fwd 10');
    if (e.length !== 1) throw new Error('expected 1 error');
    if (!e[0].msg.includes('fwd')) throw new Error(e[0].msg);
  });

  t('fd with no number is rejected', () => {
    if (errs('fd').length !== 1) throw new Error('expected 1 error');
  });

  t('pu with a number is rejected', () => {
    const e = errs('pu 5');
    if (e.length !== 1) throw new Error(`expected 1 error, got ${e.length}`);
    if (!e[0].msg.includes('takes no number')) throw new Error(e[0].msg);
  });

  t('fd 100 / rt 90 / fd 100 lands south-east', () => {
    const { state } = exec('fd 100\nrt 90\nfd 100');
    eq(state.x, 100, 'x'); eq(state.y, -100, 'y'); eq(state.heading, 90, 'heading');
  });

  t('bk 50 equals fd -50', () => {
    const a = exec('rt 30\nbk 50').state, b = exec('rt 30\nfd -50').state;
    eq(a.x, b.x, 'x'); eq(a.y, b.y, 'y');
  });

  t('pen up draws nothing', () => {
    const { segs } = exec('pu\nfd 100\npd\nfd 100');
    if (segs.length !== 1) throw new Error(`expected 1 segment, got ${segs.length}`);
  });

  t('blanks and comments yield no instructions', () => {
    const tr = trace('fd 10\n\n; nope\nrt 90');
    if (tr.length !== 2) throw new Error(`expected 2 instructions, got ${tr.length}`);
    if (tr[1].instr.line !== 3) throw new Error(`rt 90 reports line ${tr[1].instr.line}`);
  });

  t('several instructions on one line are legal', () => {
    const tr = trace('fd 100 rt 90');
    if (tr.length !== 2) throw new Error(`expected 2 instructions, got ${tr.length}`);
    if (errs('fd 100 rt 90').length) throw new Error('unexpected error');
  });

  t('a square returns home', () => {
    const { state } = exec('fd 100\nrt 90\nfd 100\nrt 90\nfd 100\nrt 90\nfd 100\nrt 90');
    eq(state.x, 0, 'x'); eq(state.y, 0, 'y'); eq(state.heading, 360, 'heading');
  });

  t('[fd tokenizes as two tokens', () => {
    const got = tokenize('repeat 2 [fd 10]').map(x => x.text).join(' ');
    if (got !== 'repeat 2 [ fd 10 ]') throw new Error(got);
  });

  t('one-line and multi-line repeat agree', () => {
    const one = compile('repeat 4 [fd 100 rt 90]').body;
    const many = compile('repeat 4 [\n  fd 100\n  rt 90\n]').body;
    if (bare(one) !== bare(many)) throw new Error(bare(one) + ' vs ' + bare(many));
  });

  t('repeat draws the same square as the unrolled form', () => {
    const a = exec('repeat 4 [fd 100 rt 90]').state;
    const b = exec('fd 100\nrt 90\nfd 100\nrt 90\nfd 100\nrt 90\nfd 100\nrt 90').state;
    eq(a.x, b.x, 'x'); eq(a.y, b.y, 'y'); eq(a.heading, b.heading, 'heading');
  });

  t('nested repeat yields every instruction', () => {
    const tr = trace('repeat 2 [repeat 2 [fd 10]]');
    if (tr.length !== 4) throw new Error(`expected 4, got ${tr.length}`);
  });

  t('trail reports the iteration', () => {
    const { trail } = trace('repeat 4 [fd 1 rt 1]')[2];
    if (JSON.stringify(trail) !== '[{"i":2,"of":4}]') throw new Error(JSON.stringify(trail));
  });

  t('depth rises and falls with nesting', () => {
    const got = trace('repeat 2 [repeat 2 [fd 10] rt 90]\nfd 5')
      .map(x => x.trail.length).join('');
    if (got !== '2212210') throw new Error(got);
  });

  t('step out leaves the loop', () => {
    const tr = trace('repeat 3 [fd 1 rt 1]\nfd 50');
    const depth = tr[1].trail.length;
    let j = 1;
    while (j < tr.length && tr[j].trail.length >= depth) j++;
    if (j !== 6) throw new Error(`landed at ${j}`);
    if (tr[j].instr.arg !== 50) throw new Error('did not land on fd 50');
  });

  t('unclosed [ is reported where it opened', () => {
    const e = errs('fd 1\nrepeat 2 [fd 10\nfd 2');
    if (e.length !== 1) throw new Error(`expected 1 error, got ${e.length}`);
    if (e[0].line !== 1) throw new Error(`reported line ${e[0].line}`);
    if (!e[0].msg.includes('unclosed')) throw new Error(e[0].msg);
  });

  t('a stray ] is an error', () => {
    if (errs('fd 10 ]').length !== 1) throw new Error('expected 1 error');
  });

  t('repeat without a count is an error', () => {
    if (errs('repeat [fd 10]').length !== 1) throw new Error('expected 1 error');
  });

  t('repeat 0 runs nothing', () => {
    if (errs('repeat 0 [fd 10]').length) throw new Error('unexpected error');
    if (trace('repeat 0 [fd 10]').length !== 0) throw new Error('expected no instructions');
  });

  t('repeat 2.5 is an error', () => {
    if (errs('repeat 2.5 [fd 10]').length !== 1) throw new Error('expected 1 error');
    if (errs('repeat -1 [fd 10]').length !== 1) throw new Error('expected 1 error');
  });

  t('controls disable where they make no sense', () => {
    const show = s => Object.values(buttonState(s)).map(v => v ? 1 : 0).join('');
    const cases = [                                                 // step out run reset
      ['editing',     { editing:true,  running:false, remaining:false, depth:0 }, '1010'],
      ['paused',      { editing:false, running:false, remaining:true,  depth:0 }, '1011'],
      ['paused+loop', { editing:false, running:false, remaining:true,  depth:1 }, '1111'],
      ['playing',     { editing:false, running:true,  remaining:true,  depth:1 }, '0011'],
      ['finished',    { editing:false, running:false, remaining:false, depth:0 }, '0001'],
    ];
    for (const [name, state, want] of cases) {
      const got = show(state);
      if (got !== want) throw new Error(`${name}: got ${got}, want ${want}`);
    }
  });

  return out;
}

// ---------- app ---------------------------------------------------------

const SAMPLE = `; draw a square
repeat 4 [
  fd 100
  rt 90
]

; hop away without drawing
pu
rt 45
fd 60
pd
fd 40`;

const DELAYS = { slow:600, medium:200, fast:0 };

// ponytail: a synchronous burst cannot be interrupted, so it is capped.
// Raise it if someone turns up with a legitimately long program.
const MAX_STEPS = 100000;

function main() {
  const $ = id => document.getElementById(id);
  const paper = $('paper'), sprite = $('sprite');
  const ink = paper.getContext('2d'), nib = sprite.getContext('2d');

  // `pending` is the next instruction, pulled but not yet executed. That one
  // instruction of lookahead is what lets the controls know the loop depth
  // before you press anything.
  let iter = null, pending = null, last = null, lineCount = 0;
  let state = null, timer = null, running = false, editing = true;

  // ponytail: sized once on load; resizing the window does not re-fit the
  // canvas. Add a resize handler that replays stored segments if it matters.
  for (const c of [paper, sprite]) {
    c.width = c.parentElement.clientWidth;
    c.height = c.parentElement.clientHeight;
  }
  const home = () => ({ x:paper.width / 2, y:paper.height / 2, heading:0, pen:true });

  const setStatus = (text, bad) => {
    $('status').textContent = text;
    $('status').classList.toggle('err', !!bad);
  };

  const describe = ({ line, trail }) =>
    `line ${line + 1}/${lineCount}`
    + (trail.length ? ' · repeat ' + trail.map(r => `${r.i}/${r.of}`).join(' › ') : '');

  function syncButtons() {
    const on = buttonState({
      editing, running,
      remaining: pending !== null,
      depth: pending ? pending.trail.length : 0,
    });
    for (const id of ['step', 'stepout', 'run', 'reset']) $(id).disabled = !on[id];
  }

  function drawSegment(s) {
    ink.strokeStyle = '#7ee787';
    ink.lineWidth = 2;
    ink.lineCap = 'round';
    ink.beginPath();
    ink.moveTo(s.x1, s.y1);
    ink.lineTo(s.x2, s.y2);
    ink.stroke();
  }

  function drawTurtle() {
    nib.clearRect(0, 0, sprite.width, sprite.height);
    nib.save();
    nib.translate(state.x, state.y);
    nib.rotate(state.heading * RAD);
    nib.beginPath();
    nib.moveTo(0, -13);
    nib.lineTo(8, 9);
    nib.lineTo(0, 4);
    nib.lineTo(-8, 9);
    nib.closePath();
    nib.fillStyle = state.pen ? '#4ea1ff' : 'transparent';
    nib.strokeStyle = '#4ea1ff';
    nib.lineWidth = 1.5;
    nib.fill();
    nib.stroke();
    nib.restore();
  }

  function highlight(line) {
    const rows = $('listing').children;
    for (const row of rows) row.classList.remove('cur');
    if (rows[line]) {
      rows[line].classList.add('cur');
      rows[line].scrollIntoView({ block:'nearest' });
    }
  }

  // Everything the eye needs, done once rather than per instruction, so a
  // burst of thousands of steps does not repaint thousands of times.
  function paint() {
    drawTurtle();
    if (last) highlight(last.line);
    setStatus(pending ? describe(last) : 'done');
  }

  // Compile and switch to run mode. On a parse error stay in edit mode so the
  // typo can be fixed in place, and put the caret on the offending line.
  function enterRun() {
    const source = $('src').value;
    const { body, errors } = parseProgram(tokenize(source));
    if (errors.length) {
      const { line, msg } = errors[0];
      setStatus(`line ${line + 1}: ${msg}`, true);
      const at = source.split('\n').slice(0, line).join('\n').length + (line ? 1 : 0);
      $('src').focus();
      $('src').setSelectionRange(at, at + source.split('\n')[line].length);
      return false;
    }
    const lines = source.split('\n');
    lineCount = lines.length;
    $('listing').replaceChildren(...lines.map(text => {
      const row = document.createElement('div');
      row.textContent = text || ' ';
      return row;
    }));
    $('src').hidden = true;
    $('listing').hidden = false;
    $('src').disabled = true;
    iter = walk(body);
    pending = iter.next().value ?? null;
    editing = false;
    return true;
  }

  // Executes the pending instruction and pulls the next. `quiet` skips the
  // repaint, for callers that paint once at the end.
  function doStep(quiet) {
    if (!pending) { if (!quiet) setStatus('done'); return false; }
    const { instr, trail } = pending;
    const { state:next, segment } = step(state, instr);
    state = next;
    if (segment) drawSegment(segment);
    last = { line:instr.line, trail };
    pending = iter.next().value ?? null;
    if (!quiet) paint();
    return true;
  }

  // Run synchronously while `cont` holds. Used by fast mode and Step Out.
  function burst(cont) {
    let n = 0;
    while (cont() && doStep(true)) {
      if (++n >= MAX_STEPS) {
        paint();
        return setStatus(`stopped after ${MAX_STEPS} steps`, true);
      }
    }
    paint();
  }

  function stop() {
    running = false;
    clearTimeout(timer);
    $('run').textContent = 'Run';
    syncButtons();
  }

  function tick() {
    if (!running) return;
    if (DELAYS[$('speed').value] === 0) {           // fast: no timer at all
      burst(() => running);
      return stop();
    }
    if (!doStep()) return stop();
    timer = setTimeout(tick, DELAYS[$('speed').value]);
  }

  function reset() {
    stop();
    ink.clearRect(0, 0, paper.width, paper.height);
    iter = null; pending = null; last = null;
    state = home(); editing = true;
    $('listing').hidden = true;
    $('src').hidden = false;
    $('src').disabled = false;
    drawTurtle();
    setStatus('ready');
    syncButtons();
  }

  $('reset').onclick = reset;

  $('step').onclick = () => {
    stop();
    if (editing && !enterRun()) return;
    doStep();
    syncButtons();
  };

  $('stepout').onclick = () => {
    stop();
    const depth = pending.trail.length;
    burst(() => pending && pending.trail.length >= depth);
    syncButtons();
  };

  $('run').onclick = () => {
    if (running) return stop();
    if (editing && !enterRun()) return;
    running = true;
    $('run').textContent = 'Stop';
    syncButtons();
    tick();
  };

  $('src').value = SAMPLE;
  reset();
}

function showTests() {
  const results = runTests();
  const failed = results.filter(r => !r.ok).length;
  document.body.replaceChildren(Object.assign(document.createElement('pre'), {
    id: 'tests',
    innerHTML: results
      .map(r => r.ok
        ? `<span class="ok">pass</span>  ${r.name}`
        : `<span class="no">FAIL</span>  ${r.name}\n        ${r.why}`)
      .join('\n')
      + `\n\n${results.length - failed}/${results.length} passed`,
  }));
}

if (typeof document !== 'undefined') {
  (location.search.includes('test') ? showTests : main)();
}
</script>
</body>
</html>
